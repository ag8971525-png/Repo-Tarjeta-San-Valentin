<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amigo Secreto</title>
    <link rel="stylesheet" href="Css/Styles.css">
</head>

<body>
    <input type="checkbox" id="girar">
    <div class="contenedor-imagen">
        <label for="girar" class="boton-tarjeta"></label>
        <div class="tarjeta">
            <div class="frente">
                <h2>
                    <b>
                        <i>Mi amigo secreto es...</i>
                    </b>
                </h2>
            </div>
            <div class="atras">
                <input type="checkbox" id="girarFoto">
                <label for="girarFoto" class="marco-foto">
                    <div class="foto-tarjeta">
                        <div class="foto-frente">
                            <p>
                                ¿Quién será?
                            </p>
                        </div>
                        <div class="foto-atras">
                            <img src="TU_FOTO.jpg"
                                 alt="Foto de mi amigo secreto">
                        </div>
                    </div>
                </label>
                <p class="mensaje">
                    Un gusto coincidir en este camino.
                    <br>
                    ¡Muchos éxitos, compañero!
                </p>
            </div>
        </div>
    </div>
</body>
</html>
